bash_rules:
- name: Block mkdir to wrong claude paths
  command_pattern: ^mkdir$
  argument_pattern: .*(inav/claude|inav2/claude|inav-configurator/claude|inavwiki/claude|PrivacyLRS/claude).*
  category: write
  decision: deny
  message: STOP! The claude/ directory is at ~/inavflight/claude/, NOT inside inav/,
    inav2/, inav-configurator/, inavwiki/, or PrivacyLRS/. Use the correct path when
    creating directories.
- name: Allow mkdir for new projects in claude/projects/active
  command_pattern: ^mkdir$
  argument_pattern: .*(claude/)?projects/active/.*
  category: write
  decision: allow
  precondition_script: "# Verify that the parent directory (claude/projects/active)\
    \ exists\n# This prevents creating projects in the wrong location\nif [ -d \"\
    claude/projects/active\" ] || [ -d \"/home/raymorris/Documents/planes/inavflight/claude/projects/active\"\
    \ ]; then\n  echo \"allow\"\nelse\n  echo \"deny\"\nfi\n"
  message: Creating new project directory under claude/projects/active/
- name: Block cp/mv to wrong claude paths
  command_pattern: ^(cp|mv)$
  argument_pattern: .*(inav/claude|inav2/claude|inav-configurator/claude|inavwiki/claude|PrivacyLRS/claude).*
  category: write
  decision: deny
  message: STOP! The claude/ directory is at ~/inavflight/claude/, NOT inside inav/,
    inav2/, inav-configurator/, inavwiki/, or PrivacyLRS/. Use the correct destination
    path.
- name: Allow project moves between active/completed
  command_pattern: ^(cp|mv)$
  argument_pattern: .*(claude/projects/(active|completed)).*
  category: write
  decision: allow
  message: Manager project organization - moving between active and completed directories
- name: Allow cp of .uf2 files to RP2350 media directory
  command_pattern: ^cp$
  argument_pattern: .*\.uf2.*(/media/raymorris/RP2350/).*
  category: write
  decision: allow
  message: Copy RP2350 firmware .uf2 files to device media directory for flashing
- name: Allow git add with specific files or paths (not -A)
  command_pattern: ^git$
  argument_pattern: ^(-C\s+\S+\s+)?add\s+(?!-A\b).*
  category: write
  decision: allow
  message: Git add with specific files allowed (use this, not git add -A)
- name: Block git add -A
  command_pattern: ^git$
  argument_pattern: ^(-C\s+\S+\s+)?add -A
  category: write
  decision: deny
  message: 'STOP! IMPORTANT: Do NOT run ''git add -A''. Add the specific files you
    actually want.'
- name: Allow git push to master in root inavflight/ repo only
  command_pattern: ^git$
  argument_pattern: ^(-C\s+\S+\s+)?push.*(master|main).*
  category: write
  decision: allow
  precondition_script: "# Allow push to master ONLY in root inavflight/ repo, not\
    \ in sub-repos\n# The script runs in the working directory where the git command\
    \ would execute\n# Root repo path ends with /inavflight or /inavflight/\n# Sub-repo\
    \ paths contain /inav/, /inav-configurator/, /PrivacyLRS/, /mspapi2/, /inavwiki/\n\
    \n# Get the current working directory (pwd is executed in the cwd passed to subprocess.run)\n\
    ABS_CWD=$(pwd)\n\nif [ -z \"$ABS_CWD\" ]; then\n  # Can't determine path, deny\
    \ for safety\n  echo \"deny\"\n  exit 0\nfi\n\n# Check if we're in the root inavflight\
    \ repo (no sub-repo in path)\n# Root repo path should NOT be /path/to/inav, /path/to/inav-configurator,\
    \ etc.\n# We check if the path contains /(dirname)/ or ends with /(dirname)\n\
    if echo \"$ABS_CWD\" | grep -qE \"/(inav|inav-configurator|PrivacyLRS|mspapi2|inavwiki)(/|$)\"\
    ; then\n  # We're in a sub-repo, deny this push\n  echo \"deny\"\nelse\n  # We're\
    \ in root or other safe location, allow\n  echo \"allow\"\nfi\n"
  message: Push to master/main allowed for root inavflight/ repo only. Use feature
    branches for inav/, inav-configurator/, and other sub-repos.
- name: Block git push to maintenance/master in sub-repos
  command_pattern: ^git$
  argument_pattern: ^(-C\s+\S+\s+)?push.*(maintenance|master|main).*
  category: write
  decision: deny
  message: 'STOP! IMPORTANT: Do NOT push to a version branch (maintenance-9.x, maintenance-10.x)
    or to master/main in sub-repos. Use your create-pr skill with a feature branch.'
- name: Allow git push to origin with -u flag (feature branches)
  command_pattern: ^git$
  argument_pattern: ^(-C\s+\S+\s+)?push\s+(-u\s+origin\s+(?!master\b|main\b|maintenance-)\S+|origin\s+(?!master\b|main\b|maintenance-)\S+.*-u\b)
  category: write
  decision: allow
  message: Push to feature/release branch on origin with -u flag allowed for tracking
- name: Block git force push
  command_pattern: ^git$
  argument_pattern: ^(-C\s+\S+\s+)?push.*force.*
  category: write
  decision: deny
  message: 'STOP! IMPORTANT: Do NOT force push! That will break public history!'
- name: Block branch creation in root inavflight/ repo
  command_pattern: ^git$
  argument_pattern: ^(-C\s+\S+\s+)?((checkout\s+-b)|(branch\s+(?!-[a-z]*(-|l|a|r|v|d|m|n|s|t|show|list|all|remotes|verbose|delete|merged|no-merged|show-current|track)))|(switch\s+(-c|--create))).*
  category: write
  decision: deny
  precondition_script: "# Allow branch creation in sub-repos (inav, inav2, inav-configurator,\
    \ PrivacyLRS, mspapi2, inavwiki, OpenTX-Telemetry-Widget, blackbox-tools, iNavFlight.github.io)\n\
    # Block branch creation ONLY in the root inavflight/ repo\n#\n# The precondition_script\
    \ needs to handle two cases:\n# 1. Direct commands: git branch -b feature (check\
    \ pwd)\n# 2. Chained commands: cd /path/to/inav && git branch -b feature (check\
    \ {ORIGINAL_COMMAND} for cd)\n\nABS_CWD=$(pwd)\n\nif [ -z \"$ABS_CWD\" ]; then\n\
    \  # Can't determine path, deny for safety\n  echo \"deny\"\n  exit 0\nfi\n\n\
    # Check if the ORIGINAL_COMMAND contains a cd to a sub-repo\n# Pattern: cd ...\
    \ /inav, /inav2, /inav-configurator, /PrivacyLRS, /mspapi2, /inavwiki, /OpenTX-Telemetry-Widget,\
    \ /blackbox-tools, or /iNavFlight.github.io\n# This handles cases like: cd /home/.../inav\
    \ && git branch -b feature\nORIGINAL_CMD=\"{ORIGINAL_COMMAND}\"\nif [ -n \"$ORIGINAL_CMD\"\
    \ ] && echo \"$ORIGINAL_CMD\" | grep -qE \"cd\\\\s+[^&|;]*/(inav3|inav2|inav|inav-configurator|PrivacyLRS|mspapi2|inavwiki|OpenTX-Telemetry-Widget|blackbox-tools|iNavFlight\\\
    \\.github\\\\.io)(/|$|\\\\s+)\"; then\n  # The original command contains a cd\
    \ into a sub-repo, allow branch creation\n  echo \"allow\"\n  exit 0\nfi\n\n#\
    \ Check if we're in a sub-repo (contains /inav2/, /inav/, /inav-configurator/,\
    \ /PrivacyLRS/, /mspapi2/, /inavwiki/, /OpenTX-Telemetry-Widget/, /blackbox-tools/,\
    \ or /iNavFlight.github.io/)\nif echo \"$ABS_CWD\" | grep -qE \"/(inav3|inav2|inav|inav-configurator|PrivacyLRS|mspapi2|inavwiki|OpenTX-Telemetry-Widget|blackbox-tools|iNavFlight\\\
    \\.github\\\\.io)(/|$)\"; then\n  # We're in a sub-repo, allow branch creation\
    \ here\n  echo \"allow\"\nelse\n  # We're in root inavflight/ repo, deny branch\
    \ creation\n  echo \"deny\"\nfi\n"
  message: 'Branch creation blocked in root inavflight/ repo. Branches should be created
    in the appropriate project repo instead: inav/, inav2/, inav3/, inav-configurator/,
    PrivacyLRS/, mspapi2/, inavwiki/, OpenTX-Telemetry-Widget/, blackbox-tools/, or
    iNavFlight.github.io/.'
- name: Block git commit with Claude mentions
  command_pattern: ^git$
  argument_pattern: ^(-C\s+\S+\s+)?commit.*
  category: write
  decision: ask
  precondition_script: "# Block commits that mention Claude, Co-Authored-By, or noreply@anthropic.com\n\
    # The commit message may be in a heredoc or direct string\nORIGINAL_CMD=\"{ORIGINAL_COMMAND}\"\
    \n\n# Safety check: if ORIGINAL_COMMAND is empty or not substituted, allow the\
    \ commit\n# (let default rules handle it)\nif [ -z \"$ORIGINAL_CMD\" ]; then\n\
    \  echo \"allow\"\n  exit 0\nfi\n\nif echo \"$ORIGINAL_CMD\" | grep -qiE \"(Co-Authored|noreply@anthropic)\"\
    ; then\n  echo \"deny\"\nelse\n  echo \"allow\"\nfi\n"
  message: '❌ REJECTION: Commit message contains ''Co-Authored-By'' or ''noreply@anthropic.com''.
    Do NOT mention Claude in public commit messages. Remove the attribution line and
    try again.'
- name: Allow git log and show (read operations)
  command_pattern: ^(GIT_PAGER=cat|git)$
  argument_pattern: ^(git\s+)?(log|show).*
  category: read
  decision: allow
  message: Git log/show read operations (GIT_PAGER=cat prevents pager from blocking
    output)
- name: Allow git read operations
  command_pattern: ^git$
  argument_pattern: ^(-c\s+safe\.directory=\S+\s+)?(-C\s+\S+\s+)?(status|log|diff|show|branch|remote|describe|rev-parse|rev-list|cat-file|ls-tree|ls-files|grep|merge-base|blame|tag|fetch).*
  category: read
  decision: allow
- name: Allow git pull
  command_pattern: ^git$
  argument_pattern: ^(-C\s+\S+\s+)?pull.*
  category: write
  decision: allow
- name: Allow git checkout/stash/cherry-pick
  command_pattern: ^git$
  argument_pattern: ^(-C\s+\S+\s+)?(checkout|stash|cherry-pick|restore).*
  category: write
  decision: allow
- name: Allow git merge --abort (safe cleanup)
  command_pattern: ^git$
  argument_pattern: ^(-C\s+\S+\s+)?merge\s+--abort.*
  category: write
  decision: allow
  message: Git merge abort - clean exit from merge without committing
- name: Allow git merge with --no-commit and --no-ff (test merges)
  command_pattern: ^git$
  argument_pattern: ^(-C\s+\S+\s+)?merge\s+(--no-commit|--no-ff|--no-edit).*
  category: write
  decision: allow
  message: Git merge with safety flags (--no-commit, --no-ff, --no-edit) allowed for
    testing merges
- name: Git commit reminder
  command_pattern: ^git$
  argument_pattern: ^(-C\s+\S+\s+)?commit.*
  category: write
  decision: allow
  message: Git commit detected - reminder added about not mentioning Claude/AI in
    commit messages
- name: Allow find -exec with read commands, ask for others
  command_pattern: ^find$
  argument_pattern: .*-exec\s+(grep|egrep|cat|ls|head|tail|file|stat|wc|diff)\s+.*
  category: read
  decision: allow
- name: Ask for find -exec with non-read commands
  command_pattern: ^find$
  argument_pattern: .*-exec.*
  category: other
  decision: ask
  message: find with -exec requires approval
- name: Allow echo to skip-scorecard file
  command_pattern: ^echo$
  argument_pattern: .*(>>|>)\s*/tmp/claude/skip-scorecard-inav\.txt.*
  category: write
  decision: allow
  message: echo to skip-scorecard file allowed for PR triage workflow
- name: Ask for echo with file redirection, allow otherwise
  command_pattern: ^echo$
  argument_pattern: .*>>?.*
  category: write
  decision: ask
  message: echo with file redirection requires approval
- name: Allow echo without redirection
  command_pattern: ^echo$
  category: read
  decision: allow
- name: Allow cat > to claude/ and lock files, ask for others
  command_pattern: ^cat$
  argument_pattern: ^>\s+.*(claude/|locks/.*\.lock).*
  category: write
  decision: allow
- name: Allow cat >> to test files (.c, .cc, .h)
  command_pattern: ^cat$
  argument_pattern: ^>>\s+.*(test|tests)/.*\.(c|cc|h|cpp|cxx)$
  category: write
  decision: allow
  message: Appending test code to unit test files allowed
- name: Ask for cat > to other locations
  command_pattern: ^cat$
  argument_pattern: (^|\s)>>?
  category: write
  decision: ask
  message: cat with stdout redirection requires approval
- name: Allow cp/mv within role email directories
  command_pattern: ^(cp|mv)$
  argument_pattern: .*(claude/(developer|manager|release-manager|security-analyst)/(inbox|sent|inbox-archive|email)).*
  category: write
  decision: allow
- name: Allow safe file operations (tmp, claude-*, SITL, CMake)
  command_pattern: ^(rm|cp|mv|touch|mkdir)$
  argument_pattern: .*/tmp/(claude-.*|.*)|^/tmp/(claude-.*|.*)|^-[pf] /tmp/(claude-.*|.*)|.*eeprom\.bin.*|^-f
    CMakeCache\.txt$
  category: write
  decision: allow
  message: Safe file operations allowed for /tmp/ and /tmp/claude-* directories
- name: Allow rm of ninja build cache files
  command_pattern: ^rm$
  argument_pattern: ^-f (build\.ninja|\./?\.ninja_(deps|log)).*
  category: write
  decision: allow
  message: Safe ninja build cache cleanup - build.ninja, .ninja_deps, .ninja_log
- name: Block dangerous recursive operations
  command_pattern: ^(rm|mv|cp)$
  argument_pattern: .*-r.*
  category: write
  decision: ask
  message: Recursive file operations require manual approval
- name: Allow build tools and compilers
  command_pattern: ^(cd|cmake|make|dfu-util|npm|pip|pio|gcc|g\+\+|clang|arm-none-eabi-.*|ninja|time)$
  category: other
  decision: allow
- name: Allow tee for build output logging
  command_pattern: ^tee$
  category: write
  decision: allow
  message: tee command for capturing and logging build output (used by inav-builder
    for build logs)
- name: Allow nproc for determining CPU count
  command_pattern: ^nproc$
  category: read
  decision: allow
  message: nproc command for determining available CPU cores for parallel builds
- name: Allow python3 for any script
  command_pattern: ^python3$
  category: other
  decision: allow
  message: Python3 execution for scripts
- name: Allow ARM cross-compiler tools (nm, objdump)
  command_pattern: ^(arm-none-eabi-nm|arm-none-eabi-objdump)$
  category: read
  decision: allow
  message: ARM cross-compiler tools for inspecting ELF/binary firmware files (read-only)
- name: Allow lsusb for USB device queries
  command_pattern: ^lsusb$
  category: read
  decision: allow
  message: USB device listing tool (read-only)
- name: Allow lsblk for block device information
  command_pattern: ^lsblk$
  category: read
  decision: allow
  message: Block device listing tool (read-only)
- name: Allow pkill for openocd termination
  command_pattern: ^pkill$
  argument_pattern: .*openocd.*
  category: other
  decision: allow
  message: Process termination for openocd debugging server
- name: Allow openocd binary from pico-sdk
  command_pattern: ^/home/raymorris/\.pico-sdk/openocd/0\.12\.0\+dev/openocd$
  category: other
  decision: allow
  message: OpenOCD debugger from pico-sdk installation
- name: Allow picotool for Pico device operations
  command_pattern: ^picotool$
  category: other
  decision: allow
  message: Pico device tool for flashing and debugging
- name: Allow emsdk environment setup
  command_pattern: ^source$
  argument_pattern: .*emsdk(_env)?\.sh.*
  category: other
  decision: allow
  message: Emscripten SDK environment setup for WASM builds
- name: Allow python3 and scripts in claude/ directories
  command_pattern: ^(python3|.*(\.claude/|claude/).*)
  argument_pattern: .*(\.claude/|claude/|fetch_issues\.py).*
  category: other
  decision: allow
- name: Allow view.sh command
  command_pattern: ^.*view\.sh$
  category: other
  decision: allow
  message: view.sh command allowed for viewing content
- name: Allow gh-issue-view.sh script with any arguments
  command_pattern: ^.*gh-issue-view\.sh$
  category: other
  decision: allow
  message: gh-issue-view.sh script - fetches and displays GitHub issue/PR details
    with comments
- name: Allow PR triage and analysis scripts
  command_pattern: ^bash$
  argument_pattern: .*(claude/developer/scripts/triage/(fetch-next-pr|update-pr|pr-scorecard|pr-scorecard-record|scorecard-triage)|\.github/scripts/(extract-pg-sizes-nm|check-pg-struct-sizes))\.sh.*
  category: other
  decision: allow
  message: PR triage and parameter analysis scripts (includes PR scoring, fetching,
    and analysis)
- name: Allow reboot-to-dfu skill script
  command_pattern: ^((/home/raymorris/Documents/planes/inavflight)?/?(\.)?/?claude/skills/flash-firmware-dfu/reboot-to-dfu\.py)$
  category: other
  decision: allow
  message: Firmware flashing skill - reboot device to DFU mode
- name: Allow shell script execution (.sh files)
  command_pattern: ^\./(.*\.sh|make-versioned-docs).*
  category: other
  decision: allow
  message: Shell script execution in current/project directories
- name: Allow WASM SITL build scripts
  command_pattern: .*(build_sitl_wasm\.sh|copy-wasm-to-configurator\.js)$
  category: other
  decision: allow
  message: WASM SITL build script execution for development
- name: Allow build_sitl.sh script (native SITL builds)
  command_pattern: .*(build_sitl\.sh)$
  category: other
  decision: allow
  message: SITL build script execution for native/Linux builds (cmake/make-based)
- name: Allow mkdir -p build_sitl for SITL builds
  command_pattern: ^mkdir$
  argument_pattern: .*-p.*build_sitl.*
  category: write
  decision: allow
  message: Create build_sitl directory for SITL build output (routine, non-destructive)
- name: Allow node copy-wasm-to-configurator.js
  command_pattern: ^node$
  argument_pattern: .*copy-wasm-to-configurator\.js.*
  category: other
  decision: allow
  message: Node.js script to copy WASM SITL artifacts to configurator resources
- name: Allow WASM SITL output copy (build_SITL to resources/sitl)
  command_pattern: ^cp$
  argument_pattern: .*(build_SITL/bin/SITL\.(elf|wasm|wasm\.map)|inav-configurator/resources/sitl/).*
  category: write
  decision: allow
  message: Copy WASM SITL artifacts to configurator resources directory
- name: Allow unit test executables (build_test/src/test/unit/*)
  command_pattern: ^(\./)?(.*_unittest)$
  category: other
  decision: allow
  message: Unit test executable allowed for development testing
- name: Allow SITL and special executables
  command_pattern: ^(pkill|kill|.*SITL\.elf$|.*pdf_indexer\.py$)
  category: other
  decision: allow
- name: Allow .cjs test file operations
  command_pattern: ^(chmod|node)$
  argument_pattern: .*(test|tests)/.*\.cjs.*
  category: other
  decision: allow
  message: CommonJS test file operations (chmod +x, node execution)
- name: Allow pgrep command
  command_pattern: ^pgrep$
  category: read
  decision: allow
  message: pgrep - list processes by name (read-only)
- name: Allow nc (netcat) command
  command_pattern: ^nc$
  category: other
  decision: allow
  message: nc (netcat) - network utility for port testing and connections
- name: Allow common read commands
  command_pattern: ^(grep|egrep|find|cat|ls|head|tail|less|more|wc|sort|uniq|diff|stat|file|du|df|awk|sed|cut|xargs|printf|pwd|whoami|md5sum|lsusb|sleep|ss|date|touch|ld|rg|fd|pdfgrep|pdftotext|jq|readelf|objdump|nm|size|objcopy|mktemp)$
  category: read
  decision: allow
- name: Allow blackbox_decode command
  command_pattern: ^(blackbox_decode|.*/blackbox_decode)$
  category: other
  decision: allow
  message: blackbox_decode is allowed for decoding INAV/Betaflight blackbox flight
    logs
- name: Allow shell syntax elements
  command_pattern: ^(#.*|\(.*|if|then|else|elif|fi|for|while|do|done|case|esac|break|continue|\[|\[\[|test|[0-9]>|[0-9]|>>|>|\s*)$
  category: read
  decision: allow
- name: Allow command substitution for capturing output from safe commands
  command_pattern: ^\\$\\(.*\\)$
  argument_pattern: ^(grep|find|cat|ls|head|tail|wc|pwd|echo|date|git|cut|sort|uniq)\s+.*
  category: read
  decision: allow
  message: Command substitution $(...) capturing output from read-only commands (safe
    pattern)
- name: Allow arithmetic expansion in shell (loop counters, calculations)
  command_pattern: ^\\$\\(\\(.*\\)\\)$
  category: read
  decision: allow
  message: Arithmetic expansion $((...)) for loop counters and calculations (safe)
- name: Allow variable assignment with command substitution from safe sources
  command_pattern: ^[A-Z_][A-Z0-9_]*=.*
  argument_pattern: ^\\$\\((grep|find|cat|ls|head|tail|wc|pwd|echo|git|cut|sort|uniq)\s+.*\\).*
  category: read
  decision: allow
  message: Variable assignment with command substitution from safe read-only commands
- name: Allow PR variable assignments
  command_pattern: ^PR=.*
  category: read
  decision: allow
  message: Shell variable assignment for PR number
- name: Allow simple shell variable assignments (VAR=..., etc.)
  command_pattern: ^[A-Z_][A-Z0-9_]*=.*
  argument_pattern: ^(gh|git|curl|node|npm)\s+.*
  category: read
  decision: allow
  message: Shell variable assignment before safe read/utility commands
- name: Allow standalone shell variable assignment with a literal value
  command_pattern: ^[A-Z_][A-Z0-9_]*=[A-Za-z0-9_./:~-]*$
  category: read
  decision: allow
  message: Standalone shell variable assignment with a literal value (no command substitution)
- name: Block gh pr review
  command_pattern: ^gh$
  argument_pattern: ^pr\s+review.*
  category: other
  decision: deny
  message: STOP! The 'gh pr review' command is not allowed. Pull request reviews must
    be done through the GitHub web interface.
- name: Allow gh pr create to master in iNavFlight.github.io
  command_pattern: ^gh$
  argument_pattern: .*pr\s+create.*--base\s+master.*
  category: other
  decision: allow
  precondition_script: "# Allow PRs to master for iNavFlight.github.io (documentation\
    \ site)\n# Block PRs to master for firmware repos\nABS_CWD=$(pwd)\nif echo \"\
    $ABS_CWD\" | grep -q \"iNavFlight\\.github\\.io\"; then\n  echo \"allow\"\nelse\n\
    \  echo \"deny\"\nfi\n"
  message: Pull request to master allowed for iNavFlight.github.io documentation site
- name: Block gh pr create targeting master
  command_pattern: ^gh$
  argument_pattern: .*pr\s+create.*--base\s+master.*
  category: other
  decision: deny
  message: pull requests should never target master in firmware repos. Read CRITICAL-BEFORE-PR.md.
    (Allowed only for iNavFlight.github.io documentation site)
- name: Allow gh api for read-only queries (GET, no --method POST/PATCH/DELETE)
  command_pattern: ^gh$
  argument_pattern: ^api\s+repos/.*
  category: read
  precondition_script: "# Allow gh api commands that are read-only (no --method POST/PATCH/DELETE)\n\
    ARGS=\"{ARGS}\"\nif echo \"$ARGS\" | grep -qE \"(--method\\\\s+(POST|PATCH|DELETE))\"\
    ; then\n  echo \"ask\"\nelse\n  echo \"allow\"\nfi\n"
  message: GitHub API read-only queries (GET requests)
- name: Allow GitHub CLI read operations
  command_pattern: ^gh$
  argument_pattern: ^(pr|issue|run|release|workflow|repo).*(list|view|diff|checks|download).*
  category: read
  decision: allow
- name: Allow gh label list (read-only)
  command_pattern: ^gh$
  argument_pattern: ^label\s+list.*
  category: read
  decision: allow
  message: GitHub CLI read-only label list operation for verifying PR labels
- name: Allow gh pr create for version bumps and feature PRs
  command_pattern: ^gh$
  argument_pattern: ^pr\s+create.*
  category: other
  decision: allow
  message: Pull request creation allowed
- name: Allow gh pr close
  command_pattern: ^gh$
  argument_pattern: ^pr\s+close.*
  category: other
  decision: allow
  message: Pull request close allowed
- name: Allow curl to GitHub API and debugging endpoints
  command_pattern: ^curl$
  argument_pattern: .*(api\.github\.com|http://(localhost|127\.0\.0\.1):(9222|5174)).*
  category: read
  decision: allow
  message: GitHub API queries and Chrome DevTools/development server debugging endpoints
- name: Allow mkdir for standard build directories
  command_pattern: ^mkdir$
  argument_pattern: ^(-p\s+)?(build_sitl|build_test|build)$
  category: write
  decision: allow
  message: Creating standard CMake build directories (build_sitl, build_test, build)
- name: Allow mkdir if directory exists
  command_pattern: ^mkdir$
  category: write
  precondition_script: "# Extract directory path from arguments (handles -p flag and\
    \ multiple dirs)\nDIR=$(echo \"{ARGS}\" | sed 's/^-p *//' | awk '{print $1}')\n\
    if [ -d \"$DIR\" ]; then\n  echo \"allow\"\nelse\n  echo \"ask\"\nfi\n"
